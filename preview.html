    // MARKETPLACE FEED PAGE WITH MULTI-OPTION SEARCH COMPARISON
    function Marketplace({ listings, activeCommunityId, setCurrentRoute, searchQuery, setSearchQuery, filterType, setFilterType, wishlist, toggleWishlist }) {
      const [category, setCategory] = useState('All');
      const [priceLimit, setPriceLimit] = useState(5000);

      const resetFilters = () => {
        setCategory('All');
        setPriceLimit(5000);
        setSearchQuery('');
        setFilterType('all');

      const filtered = useMemo(() => {
        return listings.filter(item => {
          if (activeCommunityId && item.communityId !== activeCommunityId) return false;
          if (filterType !== 'all' && item.type !== filterType) return false;
          if (category !== 'All' && item.category !== category) return false;
          if (item.price > priceLimit) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            return item.title.toLowerCase().includes(q) || item.description.toLowerCase().includes(q);
          }
          return true;
        });
      }, [listings, activeCommunityId, filterType, category, priceLimit, searchQuery]);

      const toggleCompare = (item) => {
        if (compareList.some(c => c.id === item.id)) {

    // AUTH SIGN-UP / ID UPLOAD SCREEN
    function Auth({ setCurrentRoute, setCurrentUser, users, setUsers }) {
      const [isLogin, setIsLogin] = useState(true);
      const [email, setEmail] = useState('');
      const [name, setName] = useState('');
      const [hostel, setHostel] = useState('');
      const [comm, setComm] = useState('iitb');
      const [cardUploaded, setCardUploaded] = useState(false);
      const [cardName, setCardName] = useState('');
      const [err, setErr] = useState('');
      const [success, setSuccess] = useState(false);

      const checkUniversityDomain = (val) => {
        return val.endsWith('.ac.in') || val.endsWith('.edu') || val.endsWith('.org');
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const matched = users.find(u => u.email.toLowerCase() === email.toLowerCase());
        if (matched) {
          setCurrentUser(matched);
          setCurrentRoute('home');
        } else {
          // Dynamic mock session user so login never errors for demo
          const dummy = { id: `u_${Date.now()}`, name: email.split('@')[0].toUpperCase(), email, avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150', communityId: comm, hostel: 'Hostel 4, Room 101', isVerified: true, rating: 5.0, reputation: 100 };
          setCurrentUser(dummy);
          setUsers([...users, dummy]);
          setCurrentRoute('home');
        }
      };

      const handleRegister = (e) => {
        e.preventDefault();
        setErr('');

        if (!checkUniversityDomain(email)) {
          setErr('Please use an academic email domain (e.g. @.ac.in, @.edu).');
          return;
        }

        if (!cardUploaded) {
          setErr('Please select a student ID Card file for simulated campus verification.');

          <main className="flex-grow max-w-7xl w-full mx-auto px-4 pt-8 pb-12">
            {(() => {
              if (currentRoute === 'home') return <Home listings={state.listings} activeCommunityId={activeCommunityId} setActiveCommunityId={setActiveCommunityId} setCurrentRoute={setCurrentRoute} setSearchQuery={setSearchQuery} setFilterType={setFilterType} wishlist={state.wishlist} toggleWishlist={toggleWishlist} />;
              if (currentRoute === 'marketplace') return <Marketplace listings={state.listings} activeCommunityId={activeCommunityId} setCurrentRoute={setCurrentRoute} searchQuery={searchQuery} setSearchQuery={setSearchQuery} filterType={filterType} setFilterType={setFilterType} wishlist={state.wishlist} toggleWishlist={toggleWishlist} />;
              if (currentRoute === 'rent') return <RentItems listings={state.listings} activeCommunityId={activeCommunityId} setCurrentRoute={setCurrentRoute} wishlist={state.wishlist} toggleWishlist={toggleWishlist} />;
              if (currentRoute === 'services') return <Services listings={state.listings} activeCommunityId={activeCommunityId} setCurrentRoute={setCurrentRoute} />;
              if (currentRoute === 'login' || currentRoute === 'register') return <Auth setCurrentRoute={setCurrentRoute} setCurrentUser={setCurrentUser} users={state.users} setUsers={setUsers} />;
              if (currentRoute === 'dashboard-user') return <UserDashboard currentUser={state.currentUser} wishlist={state.wishlist} toggleWishlist={toggleWishlist} myRentals={state.myRentals} completedOrders={state.completedOrders} listings={state.listings} setCurrentRoute={setCurrentRoute} />;
              if (currentRoute === 'dashboard-seller') return <SellerDashboard currentUser={state.currentUser} listings={state.listings} addListing={addListing} removeListing={removeListing} communities={INITIAL_COMMUNITIES} setCurrentRoute={setCurrentRoute} />;
              if (currentRoute === 'contact') return <Contact />;
              
              if (currentRoute.startsWith('product-detail-')) {
                const id = currentRoute.replace('product-detail-', '');
                return <ProductDetails itemId={id} listings={state.listings} currentUser={state.currentUser} setCurrentRoute={setCurrentRoute} toggleWishlist={toggleWishlist} wishlist={state.wishlist} bookRental={bookRental} buyItem={buyItem} />;
              }

              return <div className="text-center py-20 text-slate-500">Page not found.</div>;
            })()}
          </main>

          {/* Footer */}
          <footer className="bg-slate-900 text-white mt-auto border-t border-slate-800 py-8">
            <div className="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4 text-xs text-slate-400">
              <span className="flex items-center gap-1.5 font-bold text-slate-300">
                <Store className="w-4 h-4 text-primary" />
                UniMarket Community Marketplace Platform
              </span>
              <p>© 2026 UniMarket. Fully Sandbox Verified for College Campus Deployments.</p>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
